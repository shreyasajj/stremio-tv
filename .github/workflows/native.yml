# Native (Qt + libmpv) shell: end-to-end test, Flatpak bundles, and a GitHub
# Release with the bundles attached when a v* tag is pushed.
name: Native shell

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end test (Wayland)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - name: Build dev image
        run: docker build -t stremio-tv-native-dev native/dev
      - name: Build + run native test on headless Weston
        run: docker run --rm -v "$PWD":/src -w /src -e SHOTS=1 stremio-tv-native-dev sh native/dev/run-tests.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-screenshots
          path: test/shots/native-*.png
          if-no-files-found: ignore

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: native/packaging/flatpak/io.github.shreyasajj.StremioTV.yml
          bundle: stremio-tv-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('native/packaging/flatpak/*.yml') }}
          upload-artifact: true

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [e2e, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: stremio-tv-*
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/*.flatpak \
            --title "Stremio TV $GITHUB_REF_NAME (native)" \
            --notes-file native/RELEASE_NOTES.md \
            --target "$GITHUB_SHA"
