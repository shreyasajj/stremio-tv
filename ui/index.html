<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Stremio TV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/tv.css">
  <script src="../node_modules/hls.js/dist/hls.min.js"></script>
</head>
<body>
  <div id="app">
    <nav id="sidebar" data-nav-section="sidebar" data-nav-entry=".sidebar-item.active">
      <div class="sidebar-inner">
        <button class="focusable sidebar-item" data-screen="search"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></g></svg><span class="label">Search</span></button>
        <button class="focusable sidebar-item" data-screen="home"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></svg><span class="label">Home</span></button>
        <button class="focusable sidebar-item" data-screen="discover"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></g></svg><span class="label">Discover</span></button>
        <button class="focusable sidebar-item" data-screen="library"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6.5 3.5h11a1 1 0 0 1 1 1v16l-6.5-4-6.5 4v-16a1 1 0 0 1 1-1z"/></svg><span class="label">Library</span></button>
        <button class="focusable sidebar-item" data-screen="addons"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/><path d="M17 3.5v7M13.5 7h7"/></g></svg><span class="label">Add-ons</span></button>
        <button class="focusable sidebar-item" data-screen="settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M19 6h1M4 12h3M13 12h7M4 18h11M21 18h-1"/><circle cx="16" cy="6" r="2.5"/><circle cx="10" cy="12" r="2.5"/><circle cx="18" cy="18" r="2.5"/></g></svg><span class="label">Settings</span></button>
      </div>
    </nav>
    <main id="screens"></main>
    <div id="player-root" class="hidden"></div>
    <div id="modal-root"></div>
    <div id="toast-root"></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
